<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      padding-top: 80px;
    }

    .login-box {
      width: 360px;
    }

    h2 {
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 14px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h2>Test Login</h2>

  <input
    type="text"
    name="username"
    autocomplete="username"
    placeholder="Mobile number, username or email"
  >

  <input
    type="password"
    name="password"
    autocomplete="current-password"
    placeholder="Password"
  >

  <button type="submit" id="loginButton">
    Log in
  </button>

  <div id="status"></div>

</div>

<script>
document.getElementById("loginButton").addEventListener("click", function(e) {
  e.preventDefault();

  document.getElementById("status").textContent =
    "Test login button clicked successfully.";
});
</script>

</body>
</html>
